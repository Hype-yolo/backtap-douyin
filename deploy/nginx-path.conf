# Include INSIDE the existing HTTPS server block. Preserve its other locations.
location = /backtap { return 302 /backtap/; }
location = /backtap/ {
    root /opt/backtap-douyin/public;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control no-cache;
    add_header Referrer-Policy no-referrer always;
}
location = /backtap/download/backtap-douyin.shortcut {
    alias /opt/backtap-douyin/public/backtap-douyin.shortcut;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment; filename=backtap-douyin.shortcut; filename*=UTF-8''%E8%BD%BB%E7%82%B9%E4%B8%8B%E8%BD%BD.shortcut";
    add_header Cache-Control no-cache;
}
location ^~ /backtap/ {
    # Never log user share links or authorization headers.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8796/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_read_timeout 55s;
    add_header Referrer-Policy no-referrer always;
}
