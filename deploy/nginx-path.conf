# Include INSIDE the existing HTTPS server block. Preserve its other locations.
location = /backtap { return 302 /backtap/; }
location ^~ /backtap/ {
    # Never log user share links or authorization headers.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8796/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_read_timeout 55s;
    add_header Referrer-Policy no-referrer always;
}
